services:
  website:
    build: .
    restart: unless-stopped
    environment:
      - PORT=80
    volumes:
      - ./:/app
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: unless-stopped
x-dockge:
  urls:
    - https://uptime.kuma.pet
networks: {}
