name: Update Sponsors

on:
  schedule:
    # Every 4 hours at minute 0 (UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-sponsors
  cancel-in-progress: false

jobs:
  update-sponsors:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: actions/cache@v6
        with:
          path: cache
          key: sponsors-avatar-cache-${{ github.run_id }}
          restore-keys: |
            sponsors-avatar-cache-

      - run: npm ci

      - name: Rebuild sponsors JSON
        env:
          GITHUB_API_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: npm run sponsors:json -- --merge github-public-sponsors.json

      - name: Render sponsors SVG
        run: npm run sponsors:svg

      - name: Commit if changed
        run: |
          if git diff --quiet -- github-public-sponsors.json sponsors.svg; then
            echo "No changes, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-public-sponsors.json sponsors.svg
          git commit -m "Update sponsors"
          git push
