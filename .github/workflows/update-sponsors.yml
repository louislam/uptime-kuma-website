name: Update Sponsors

on:
  schedule:
    # Every 4 hours at minute 0 (UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-sponsors
  cancel-in-progress: false

jobs:
  update-sponsors:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Rebuild sponsors JSON
        env:
          GITHUB_API_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: npm run sponsors:json -- --merge github-public-sponsors.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- github-public-sponsors.json; then
            echo "No changes, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-public-sponsors.json
          git commit -m "Update sponsors"
          git push
